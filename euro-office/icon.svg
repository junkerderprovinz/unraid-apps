<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Euro Office">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12489f"/>
      <stop offset="1" stop-color="#0a2f6e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#f2b705"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- background tile -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#tile)"/>

  <!-- document sheet with folded corner -->
  <g filter="url(#sh)">
    <path d="M150 104 h150 l62 62 v242 a16 16 0 0 1 -16 16 H150 a16 16 0 0 1 -16 -16 V120 a16 16 0 0 1 16 -16 z" fill="#ffffff"/>
    <path d="M300 104 l62 62 h-46 a16 16 0 0 1 -16 -16 z" fill="#d7e0f2"/>
  </g>

  <!-- content lines -->
  <g fill="#c3ccdd">
    <rect x="172" y="188" width="168" height="16" rx="8"/>
    <rect x="172" y="224" width="168" height="16" rx="8"/>
    <rect x="172" y="260" width="112" height="16" rx="8"/>
  </g>
  <rect x="172" y="152" width="86" height="18" rx="9" fill="url(#gold)"/>

  <!-- euro badge -->
  <circle cx="356" cy="372" r="74" fill="url(#gold)"/>
  <circle cx="356" cy="372" r="74" fill="none" stroke="#0a2f6e" stroke-opacity="0.12" stroke-width="4"/>
  <text x="356" y="374" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" fill="#0a2f6e">&#8364;</text>
</svg>
