<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="Euro Office for Unraid">
  <defs>
    <linearGradient id="tile2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12489f"/>
      <stop offset="1" stop-color="#0a2f6e"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#f2b705"/>
    </linearGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="#ffffff"/>

  <!-- inlined icon, scaled 300/512 and placed at (470,100) -->
  <g transform="translate(470,100) scale(0.5859)">
    <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#tile2)"/>
    <g filter="url(#sh2)">
      <path d="M150 104 h150 l62 62 v242 a16 16 0 0 1 -16 16 H150 a16 16 0 0 1 -16 -16 V120 a16 16 0 0 1 16 -16 z" fill="#ffffff"/>
      <path d="M300 104 l62 62 h-46 a16 16 0 0 1 -16 -16 z" fill="#d7e0f2"/>
    </g>
    <g fill="#c3ccdd">
      <rect x="172" y="188" width="168" height="16" rx="8"/>
      <rect x="172" y="224" width="168" height="16" rx="8"/>
      <rect x="172" y="260" width="112" height="16" rx="8"/>
    </g>
    <rect x="172" y="152" width="86" height="18" rx="9" fill="url(#gold2)"/>
    <circle cx="356" cy="372" r="74" fill="url(#gold2)"/>
    <circle cx="356" cy="372" r="74" fill="none" stroke="#0a2f6e" stroke-opacity="0.12" stroke-width="4"/>
    <text x="356" y="374" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" fill="#0a2f6e">&#8364;</text>
  </g>

  <!-- wordmark -->
  <text x="810" y="228" font-family="Arial, Helvetica, sans-serif" font-size="132" font-weight="800" fill="#0a2f6e" letter-spacing="-2">Euro Office</text>
  <text x="814" y="300" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="500" fill="#5b667c" letter-spacing="1">Document server for Unraid</text>
  <rect x="816" y="330" width="150" height="10" rx="5" fill="#f2b705"/>
</svg>
