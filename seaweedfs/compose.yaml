# Built from the Unraid template in junkerderprovinz/unraid-apps by
# .github/gen-compose.py. Change the template there, not this file.
#
# Folders are created next to this file on the first start. Point the ones
# that hold your own files (downloads, storage and the like) at real folders
# first, and fill in every value marked "required".

services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: unless-stopped
    ports:
      - "8333:8333"
      - "23646:23646"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - "./appdata/data:/data"
    labels:
      homepage.href: ""
      homepage.group: Backup
      homepage.name: SeaweedFS
      homepage.icon: "https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/seaweedfs/icon.png?v=2"
      homepage.description: "S3-compatible object store"
      glance.name: SeaweedFS
      glance.icon: "https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/seaweedfs/icon.png?v=2"
      glance.description: "S3-compatible object store"
