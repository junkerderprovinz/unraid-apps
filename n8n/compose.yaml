# Built from the Unraid template in junkerderprovinz/unraid-apps by
# .github/gen-compose.py. Change the template there, not this file.
#
# Folders are created next to this file on the first start. Point the ones
# that hold your own files (downloads, storage and the like) at real folders
# first, and fill in every value marked "required".

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - "./appdata:/home/node/.n8n"
      - "./appdata/files:/files"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: "192.168.1.10"  # required
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ""  # required
      N8N_SECURE_COOKIE: "false"
      TZ: Europe/Vienna
      GENERIC_TIMEZONE: Europe/Vienna
      N8N_RUNNERS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_DIAGNOSTICS_ENABLED: "false"
      WEBHOOK_URL: "https://n8n.mydomain.tld/"  # required
      N8N_HOST: n8n.mydomain.tld  # required
      N8N_PROTOCOL: http
